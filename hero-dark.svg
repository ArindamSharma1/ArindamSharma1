<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 160" width="100%" height="160">
  <style>
    .bg { fill: transparent; }
    .text-main { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 36px; font-weight: 600; fill: #f0f6fc; letter-spacing: -1px; }
    .text-sub { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 14px; fill: #8b949e; }
    .accent-line { stroke: #30363d; stroke-width: 1; }

    /* Subtle entry animation for the accent line */
    .draw-line {
      stroke-dasharray: 800;
      stroke-dashoffset: 800;
      animation: draw 1.5s ease-out forwards;
    }
    @keyframes draw {
      to { stroke-dashoffset: 0; }
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" class="bg" />

  <!-- Animated Bottom Border -->
  <line x1="0" y1="159" x2="800" y2="159" class="accent-line draw-line" />

  <!-- Content -->
  <g transform="translate(40, 85)">
    <text class="text-main" x="0" y="0">Arindam Sharma</text>
    <text class="text-sub" x="0" y="32">Software Engineer &amp; Security Student</text>
  </g>
</svg>
